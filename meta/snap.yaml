apps:
  nginx:
    user: jitsimeet
    command: bin/service.nginx.sh
    daemon: simple
    restart-condition: always
    restart-delay: 10s
    start-timeout: 600s

  prosody:
    user: jitsimeet
    command: bin/service.prosody.sh
    daemon: simple
    restart-condition: always
    restart-delay: 10s
    start-timeout: 600s

  saslauthd:
    user: jitsimeet
    command: bin/service.saslauthd.sh
    daemon: simple
    restart-condition: always
    restart-delay: 10s
    start-timeout: 600s

  jicofo:
    user: jitsimeet
    command: bin/service.jicofo.sh
    daemon: simple
    restart-condition: always
    restart-delay: 10s
    start-timeout: 600s

  jvb:
    user: jitsimeet
    command: bin/service.jvb.sh
    daemon: simple
    restart-condition: always
    restart-delay: 10s
    start-timeout: 600s

  cli:
    command: bin/cli

  storage-change:
    command: bin/cli storage-change

  access-change:
    command: bin/cli access-change

  backup-pre-stop:
    command: bin/cli backup-pre-stop

  restore-pre-start:
    command: bin/cli restore-pre-start

  restore-post-start:
    command: bin/cli restore-post-start

description: Secure and high quality meetings
grade: stable
name: jitsimeet
summary: Jitsi Meet
